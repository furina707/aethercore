server:
  listeners:
    - protocol: http
      bind: "127.0.0.1:18080"
    - protocol: https
      bind: "127.0.0.1:18443"
      tls: true
    - protocol: socks
      bind: "127.0.0.1:11080"
    - protocol: tcp
      bind: "127.0.0.1:19999"
    - protocol: udp
      bind: "127.0.0.1:19998"
    - protocol: dns
      bind: "127.0.0.1:15353"

tls:
  cert: "certs/server.crt"
  key: "certs/server.key"

outbounds:
  - name: direct
    protocol: direct
    target: "0.0.0.0:0"
  - name: dns
    protocol: direct
    target: "8.8.8.8:53"
  - name: via-socks5
    protocol: socks5
    target: "127.0.0.1:1088"

routing:
  - name: "内网直连"
    domain_suffix: ["internal.example.com"]
    outbound: direct

observability:
  log_level: "debug"
  stats: true
  stats_interval_secs: 5

hot_reload_secs: 5

health_check:
  interval_secs: 5
  timeout_secs: 2
  max_failures: 2

# hot_reload_test_marker
